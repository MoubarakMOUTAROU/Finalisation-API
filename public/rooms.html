<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Chat avec Rooms</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #1a1a2e;
      color: #eee;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #1a1a2e;
    }

    .login-box {
      background: #16213e;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      min-width: 350px;
    }

    .login-box h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #4ecca3;
    }

    .login-box label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #aaa;
    }

    .login-box input,
    .login-box select {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      border: 1px solid #0f3460;
      border-radius: 5px;
      background: #0f3460;
      color: white;
      font-size: 14px;
    }

    .login-box button {
      width: 100%;
      padding: 12px;
      background: #4ecca3;
      color: #1a1a2e;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }

    .login-box button:hover {
      background: #3db88e;
    }

    .chat-screen {
      display: none;
      flex-direction: column;
      height: 100vh;
    }

    .chat-header {
      background: #16213e;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #0f3460;
    }

    .chat-header h2 {
      font-size: 18px;
      color: #4ecca3;
    }

    .chat-header button {
      padding: 8px 16px;
      background: #e94560;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 13px;
    }

    .chat-body {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .sidebar {
      width: 200px;
      background: #16213e;
      padding: 20px;
      border-right: 2px solid #0f3460;
    }

    .sidebar h3 {
      font-size: 14px;
      color: #4ecca3;
      margin-bottom: 12px;
    }

    .sidebar ul {
      list-style: none;
    }

    .sidebar li {
      padding: 8px 10px;
      margin-bottom: 4px;
      background: #0f3460;
      border-radius: 4px;
      font-size: 13px;
    }

    .chat-main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      list-style: none;
      padding: 20px;
    }

    #messages li {
      margin-bottom: 10px;
      padding: 8px 12px;
      background: #16213e;
      border-radius: 6px;
      max-width: 70%;
      word-wrap: break-word;
    }

    #messages li.system {
      background: transparent;
      color: #4ecca3;
      font-style: italic;
      font-size: 13px;
      text-align: center;
      max-width: 100%;
    }

    #messages li .meta {
      font-size: 11px;
      color: #4ecca3;
      margin-bottom: 4px;
    }

    #messages li .time {
      font-size: 10px;
      color: #888;
      margin-left: 8px;
    }

    .chat-input {
      display: flex;
      padding: 15px 20px;
      background: #16213e;
      border-top: 2px solid #0f3460;
      gap: 10px;
    }

    .chat-input input {
      flex: 1;
      padding: 10px;
      border: 1px solid #0f3460;
      border-radius: 5px;
      background: #0f3460;
      color: white;
    }

    .chat-input button {
      padding: 10px 20px;
      background: #4ecca3;
      color: #1a1a2e;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="login-screen" id="loginScreen">
    <div class="login-box">
      <h1>💬 Chat Rooms</h1>
      <label for="username">Votre pseudo :</label>
      <input type="text" id="username" placeholder="ex: Alice" maxlength="20" />

      <label for="room">Choisissez une room :</label>
      <select id="room"></select>

      <button id="joinBtn">Rejoindre la room</button>
    </div>
  </div>

  <div class="chat-screen" id="chatScreen">
    <div class="chat-header">
      <h2 id="roomTitle">Room</h2>
      <button id="leaveBtn">Quitter</button>
    </div>

    <div class="chat-body">
      <div class="sidebar">
        <h3>👥 Utilisateurs</h3>
        <ul id="usersList"></ul>
      </div>

      <div class="chat-main">
        <ul id="messages"></ul>

        <form class="chat-input" id="form">
          <input type="text" id="input" autocomplete="off" placeholder="Votre message..." />
          <button type="submit">Envoyer</button>
        </form>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    const loginScreen = document.getElementById('loginScreen');
    const chatScreen = document.getElementById('chatScreen');
    const usernameInput = document.getElementById('username');
    const roomSelect = document.getElementById('room');
    const joinBtn = document.getElementById('joinBtn');
    const leaveBtn = document.getElementById('leaveBtn');
    const roomTitle = document.getElementById('roomTitle');
    const usersList = document.getElementById('usersList');
    const messages = document.getElementById('messages');
    const form = document.getElementById('form');
    const input = document.getElementById('input');

    let currentUser = '';
    let currentRoom = '';

    socket.on('rooms list', (rooms) => {
      roomSelect.innerHTML = '';
      rooms.forEach((room) => {
        const option = document.createElement('option');
        option.value = room;
        option.textContent = room;
        roomSelect.appendChild(option);
      });
    });

    joinBtn.addEventListener('click', () => {
      const username = usernameInput.value.trim();
      const room = roomSelect.value;

      if (!username) {
        alert('Veuillez entrer un pseudo');
        return;
      }

      currentUser = username;
      currentRoom = room;

      socket.emit('join room', { username, room });
    });

    socket.on('joined', ({ username, room }) => {
      loginScreen.style.display = 'none';
      chatScreen.style.display = 'flex';
      roomTitle.textContent = `# ${room}`;
      messages.innerHTML = '';
    });

    socket.on('user joined', ({ message }) => {
      addSystemMessage(message);
    });

    socket.on('user left', ({ message }) => {
      addSystemMessage(message);
    });

    socket.on('room users', (users) => {
      usersList.innerHTML = '';
      users.forEach((user) => {
        const li = document.createElement('li');
        li.textContent = user;
        usersList.appendChild(li);
      });
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (input.value.trim()) {
        socket.emit('chat message', {
          room: currentRoom,
          message: input.value.trim()
        });
        input.value = '';
      }
    });

    socket.on('chat message', ({ username, message, time }) => {
      const li = document.createElement('li');

      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = username + ' ';

      const timeSpan = document.createElement('span');
      timeSpan.className = 'time';
      timeSpan.textContent = time;

      meta.appendChild(timeSpan);

      const content = document.createElement('div');
      content.textContent = message;

      li.appendChild(meta);
      li.appendChild(content);
      messages.appendChild(li);
      messages.scrollTop = messages.scrollHeight;
    });

    leaveBtn.addEventListener('click', () => {
      socket.emit('leave room');
      chatScreen.style.display = 'none';
      loginScreen.style.display = 'flex';
      usernameInput.value = '';
      messages.innerHTML = '';
      usersList.innerHTML = '';
    });

    function addSystemMessage(text) {
      const li = document.createElement('li');
      li.className = 'system';
      li.textContent = text;
      messages.appendChild(li);
      messages.scrollTop = messages.scrollHeight;
    }
  </script>
</body>
</html>
