<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Chat Socket.IO</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f5f5f5;
    }
    h1 {
      color: #333;
    }
    #messages {
      list-style: none;
      padding: 0;
      margin: 0 0 20px 0;
      max-width: 600px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 5px;
      min-height: 300px;
      padding: 10px;
    }
    #messages li {
      padding: 8px 12px;
      margin: 4px 0;
      background: #e3f2fd;
      border-radius: 4px;
      word-wrap: break-word;
    }
    #form {
      display: flex;
      gap: 8px;
      max-width: 600px;
    }
    #input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
    }
    button {
      padding: 10px 20px;
      background: #1976d2;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background: #1565c0;
    }
    #status {
      margin-bottom: 10px;
      font-size: 14px;
      color: #666;
    }
    .connected { color: green; }
    .disconnected { color: red; }
  </style>
</head>
<body>
  <h1>💬 Chat Socket.IO</h1>
  <p id="status">Connexion...</p>

  <ul id="messages"></ul>

  <form id="form" action="">
    <input id="input" autocomplete="off" placeholder="Tapez votre message..." />
    <button type="submit">Envoyer</button>
  </form>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const messages = document.getElementById('messages');
    const status = document.getElementById('status');

    socket.on('connect', () => {
      status.textContent = 'Connecté ✅ (id: ' + socket.id + ')';
      status.className = 'connected';
    });

    socket.on('disconnect', () => {
      status.textContent = 'Déconnecté ❌';
      status.className = 'disconnected';
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (input.value) {
        socket.emit('chat message', input.value);
        input.value = '';
      }
    });

    socket.on('chat message', (msg) => {
      const item = document.createElement('li');
      item.textContent = msg;
      messages.appendChild(item);
      window.scrollTo(0, document.body.scrollHeight);
    });
  </script>
</body>
</html>
